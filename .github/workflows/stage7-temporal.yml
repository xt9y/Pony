name: stage7 temporal reuse

on:
  push:
    branches: [radiance]

permissions:
  contents: write

jobs:
  stage7:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: radiance
          fetch-depth: 2
      - name: Chapter 7 architecture test
        run: python3 .github/stage7_temporal_test.py

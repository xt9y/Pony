name: stage7 temporal reuse

on:
  push:
    branches: [radiance]

permissions:
  contents: write

jobs:
  stage7:
    if: github.actor != 'github-actions[bot]' && !startsWith(github.event.head_commit.message, 'remove stage7')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: radiance
          fetch-depth: 2

      - name: Apply chapter 7
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -Fq 'NriPipeline *wavefront_temporal_pipeline;' game.h; then
            python3 .github/stage7_apply.py
            python3 .github/stage7_fix.py
          fi
          python3 - <<'PY'
          from pathlib import Path

          p = Path('shader.hlsl')
          s = p.read_text()
          dead_meta = '''    float4 meta = ProbeHistoryMeta.Load(int3(pp, 0));\n    ProbeCurrentMeta[probe] = float4(meta.x * Radiance.temporal_params.y, meta.y, meta.z + 1.0f, meta.w);\n'''
          if dead_meta in s:
              s = s.replace(dead_meta, '', 1)
          p.write_text(s)

          p = Path('render.c')
          r = p.read_text()
          if 'NriTextureBarrierDesc emissive_sync' not in r:
              old = '''    if (!enabled) return;\n\n    bind_wavefront(renderer, command_buffer, renderer->emissive_pipeline);'''
              new = '''    if (!enabled) return;\n\n    const NriAccessLayoutStage compute_storage = {\n        .access = NriAccessBits_SHADER_RESOURCE_STORAGE,\n        .layout = NriLayout_SHADER_RESOURCE_STORAGE,\n        .stages = NriStageBits_COMPUTE_SHADER\n    };\n    const NriTextureBarrierDesc emissive_sync = {\n        .texture = renderer->screen_probes.texture,\n        .before = renderer->screen_probes.state,\n        .after = compute_storage,\n        .mipNum = 1, .layerNum = 1, .planes = NriPlaneBits_COLOR\n    };\n    renderer->gpu->core.CmdBarrier(command_buffer, &(NriBarrierDesc){.textures = &emissive_sync, .textureNum = 1});\n    renderer->screen_probes.state = compute_storage;\n\n    bind_wavefront(renderer, command_buffer, renderer->emissive_pipeline);'''
              if r.count(old) != 1:
                  raise SystemExit(f'emissive sync insertion point count={r.count(old)}')
              r = r.replace(old, new, 1)

          if 'NriTextureBarrierDesc commit_inputs[]' not in r:
              old = '''    const NriAccessLayoutStage present_read = {\n        .access = NriAccessBits_SHADER_RESOURCE,\n        .layout = NriLayout_SHADER_RESOURCE,\n        .stages = NriStageBits_FRAGMENT_SHADER\n    };\n\n    NriTextureBarrierDesc to_write[] = {'''
              new = '''    const NriAccessLayoutStage present_read = {\n        .access = NriAccessBits_SHADER_RESOURCE,\n        .layout = NriLayout_SHADER_RESOURCE,\n        .stages = NriStageBits_FRAGMENT_SHADER\n    };\n\n    NriTextureBarrierDesc commit_inputs[] = {\n        {.texture = p->current_meta.texture, .before = p->current_meta.state, .after = compute_storage, .mipNum = 1, .layerNum = 1, .planes = NriPlaneBits_COLOR},\n        {.texture = renderer->screen_probes.texture, .before = renderer->screen_probes.state, .after = compute_storage, .mipNum = 1, .layerNum = 1, .planes = NriPlaneBits_COLOR}\n    };\n    renderer->gpu->core.CmdBarrier(command_buffer, &(NriBarrierDesc){.textures = commit_inputs, .textureNum = 2});\n    p->current_meta.state = compute_storage;\n    renderer->screen_probes.state = compute_storage;\n\n    NriTextureBarrierDesc to_write[] = {'''
              if r.count(old) != 1:
                  raise SystemExit(f'history input sync insertion point count={r.count(old)}')
              r = r.replace(old, new, 1)
          p.write_text(r)
          PY

      - name: GREEN - architecture test
        run: |
          set -euo pipefail
          python3 .github/stage7_temporal_test.py
          grep -Fq 'NriTextureBarrierDesc emissive_sync' render.c
          grep -Fq 'NriTextureBarrierDesc commit_inputs[]' render.c
          ! grep -Fq 'ProbeCurrentMeta[probe] = float4(meta.x * Radiance.temporal_params.y' shader.hlsl
          git diff --check

      - name: Compile active shader entries
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -o /tmp/slang.tar.gz \
            https://github.com/shader-slang/slang/releases/download/v2026.18.3/slang-2026.18.3-linux-x86_64-glibc-2.27.tar.gz
          mkdir -p /tmp/slang
          tar -xzf /tmp/slang.tar.gz -C /tmp/slang
          SLANGC="$(find /tmp/slang -type f -name slangc | head -n1)"
          test -n "$SLANGC"
          chmod +x "$SLANGC"
          export LD_LIBRARY_PATH="$(dirname "$SLANGC")/../lib:${LD_LIBRARY_PATH:-}"
          compile() {
            entry="$1"; stage="$2"; out="/tmp/${entry}.spv"
            "$SLANGC" shader.hlsl -entry "$entry" -stage "$stage" -target spirv -profile sm_6_6 -capability spirv_1_5 -matrix-layout-row-major -fvk-use-dx-layout -O3 -o "$out"
            test -s "$out"
          }
          compile VS_GBuffer vertex
          compile PS_GBufferFull fragment
          compile CS_HZB compute
          compile CS_RadianceDirect compute
          compile CS_ResetWavefront compute
          compile CS_ClassifyRayBudgets compute
          compile CS_GenerateProbeRays compute
          compile CS_WavefrontScreenTrace compute
          compile CS_WavefrontLocalTrace compute
          compile CS_ShadeRayHits compute
          compile CS_ReprojectScreenProbes compute
          compile CS_SpatialReuseScreenProbes compute
          compile CS_ResolveDirectionalProbes compute
          compile CS_EmissiveGather compute
          compile CS_CommitScreenProbeHistory compute
          compile PS_Present fragment

      - name: Syntax compile C sources
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/libsdl-org/SDL.git /tmp/SDL >/dev/null 2>&1
          git clone --depth 1 https://github.com/NVIDIA-RTX/NRI.git /tmp/NRI >/dev/null 2>&1
          FLAGS='-I. -I/tmp/SDL/include -I/tmp/NRI/Include -I/tmp/NRI/Include/Extensions'
          for f in init.c glb.c gltf.c scene.c sdf.c gpu.c render.c main.c; do
            echo "syntax $f"
            clang -std=c11 -fsyntax-only $FLAGS "$f"
          done

      - name: Commit chapter 7
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game.h render.c shader.hlsl build.c
          git diff --cached --quiet && exit 0
          git commit -m 's7 synchronize probe history'
          git push origin HEAD:radiance

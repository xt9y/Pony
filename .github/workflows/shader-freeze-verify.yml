name: shader freeze verify

on:
  push:
    branches: [radiance]
  workflow_dispatch:

jobs:
  slang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Slang
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o /tmp/slang.tar.gz https://github.com/shader-slang/slang/releases/download/v2026.18.3/slang-2026.18.3-linux-x86_64-glibc-2.27.tar.gz
          mkdir -p /tmp/slang
          tar -xzf /tmp/slang.tar.gz -C /tmp/slang
          SLANGC="$(find /tmp/slang -type f -name slangc -perm -111 | head -1)"
          test -n "$SLANGC"
          echo "SLANGC=$SLANGC" >> "$GITHUB_ENV"
      - name: Structural freeze check
        shell: bash
        run: |
          set -euxo pipefail
          for symbol in GPUSceneTriangle GPUEmissiveTriangle SurfaceHit GPUDynamicGridCell GPUGlobalSDFClipmap WorldProbeState RayBudget OctEncode OctDecode SelectEmissiveTriangle EvaluateEmissiveSample TraceDynamicGrid TraceGlobalSDF TraceUnifiedRay SurfaceCacheLookup CS_GenerateProbeRays CS_WavefrontScreenTrace CS_WavefrontDynamicTrace CS_WavefrontLocalTrace CS_WavefrontGlobalTrace CS_ShadeRayHits CS_EmissiveGather CS_ReprojectScreenProbes CS_SpatialReuseScreenProbes CS_UpdateWorldRadianceCache CS_InvalidateRadiance CS_ClassifyRayBudgets CS_ReflectionTrace PS_PresentRuntime; do
            grep -q "$symbol" shader.hlsl
          done
          ! grep -q 'near_self_hit' shader.hlsl
          ! grep -q 'DEBUG:' shader.hlsl
      - name: Compile all frozen entry points
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/spv
          compile() {
            local entry="$1" stage="$2" extra="${3:-}"
            "$SLANGC" shader.hlsl -entry "$entry" -stage "$stage" -target spirv -profile sm_6_6 -capability spirv_1_5 -matrix-layout-row-major -fvk-use-dx-layout -O3 $extra -o "/tmp/spv/$entry.spv"
          }
          compile VS_GBuffer vertex
          compile PS_GBuffer fragment
          compile PS_GBufferFull fragment
          compile VS_Present vertex
          compile PS_Present fragment -DFINAL_GI
          compile PS_PresentRuntime fragment
          for entry in CS_HZB CS_DirectRadiance CS_SurfaceCacheUpdate CS_ScreenTrace CS_ResetTraceQueue CS_CompactTraceMisses CS_BuildTraceDispatchArgs CS_SDFTrace CS_ScreenProbes CS_RadianceDirect CS_ResetWavefront CS_ClassifyRayBudgets CS_GenerateProbeRays CS_WavefrontScreenTrace CS_WavefrontDynamicTrace CS_WavefrontLocalTrace CS_WavefrontGlobalTrace CS_ShadeRayHits CS_EmissiveGather CS_ResolveDirectionalProbes CS_ReprojectScreenProbes CS_SpatialReuseScreenProbes CS_UpdateWorldRadianceCache CS_InvalidateRadiance CS_ReflectionTrace; do
            compile "$entry" compute
          done

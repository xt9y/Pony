name: emissive camera fix

on:
  push:
    branches: [radiance]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: radiance
          fetch-depth: 2

      - name: RED - confirm camera dependent legacy lighting
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'float3 sky = SkyRadiance(ray.direction_tmax.xyz);' shader.hlsl
          grep -Fq 'TraceHit screen_hit = TraceScreenRay(origin, direction' shader.hlsl
          grep -Fq 'return emitted * geometry / max(pdf_area, 1.0e-8f);' shader.hlsl
          ! grep -Fq 'source_material_id = TraceMaterialId.Load' shader.hlsl
          echo 'RED confirmed: screen misses inject sky, direct shadows depend on screen visibility, and emissive gather self-lights'

      - name: Apply fix
        run: python3 .github/emissive_camera_fix.py

      - name: GREEN - verify hierarchy and estimator
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'source_material_id = TraceMaterialId.Load' shader.hlsl
          grep -Fq 'return emitted * geometry / max(pdf_area * PI, 1.0e-8f);' shader.hlsl
          grep -Fq 'ProbeRadianceOutput[ray_pixel] = 0.0f;' shader.hlsl
          grep -Fq 'uint2 miss_destination = uint2(ray.destination % miss_width, ray.destination / miss_width);' shader.hlsl
          ! grep -Fq 'TraceHit screen_hit = TraceScreenRay(origin, direction' shader.hlsl
          ! grep -Fq 'return emitted * geometry / max(pdf_area, 1.0e-8f);' shader.hlsl
          git diff --check
          git diff --exit-code -- game.h render.c sdf.c build.c main.c

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shader.hlsl
          git diff --cached --quiet && exit 0
          git commit -m 's4 camera independent lighting'
          git push origin HEAD:radiance

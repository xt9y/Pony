name: verify-radiance

on:
  push:
    branches:
      - radiance

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch header dependencies
        run: |
          git clone --depth 1 https://github.com/NVIDIA-RTX/NRI.git /tmp/NRI
          git clone --depth 1 https://github.com/libsdl-org/SDL.git /tmp/SDL

      - name: Compile C translation units
        run: |
          mkdir -p /tmp/pony-objects
          for file in main.c init.c glb.c gltf.c scene.c sdf.c gpu.c render.c; do
            clang -std=c11 -Wall -Wextra -Wpedantic -I/tmp/NRI/Include -I/tmp/SDL/include -c "$file" -o "/tmp/pony-objects/${file%.c}.o"
          done

      - name: Install Slang
        run: |
          curl -L --fail --retry 3 -o /tmp/slang.tar.gz https://github.com/shader-slang/slang/releases/download/v2026.18.3/slang-2026.18.3-linux-x86_64-glibc-2.27.tar.gz
          mkdir -p /tmp/slang
          tar -xzf /tmp/slang.tar.gz -C /tmp/slang
          find /tmp/slang -type f -name slangc -print

      - name: Compile shaders
        run: |
          SLANG="$(find /tmp/slang -type f -name slangc | head -1)"
          test -n "$SLANG"
          chmod +x "$SLANG"
          mkdir -p build/shaders
          COMMON="-target spirv -profile sm_6_6 -capability spirv_1_5 -matrix-layout-row-major -fvk-use-dx-layout -O3"
          "$SLANG" shader.hlsl -entry VS_GBuffer -stage vertex $COMMON -o build/shaders/gbuffer.vs.spv
          "$SLANG" shader.hlsl -entry PS_GBuffer -stage fragment $COMMON -o build/shaders/gbuffer.ps.spv
          "$SLANG" shader.hlsl -entry VS_Present -stage vertex $COMMON -o build/shaders/present.vs.spv
          "$SLANG" shader.hlsl -entry PS_Present -stage fragment $COMMON -DDIRECT_RADIANCE -o build/shaders/present.ps.spv
          "$SLANG" shader.hlsl -entry CS_HZB -stage compute $COMMON -o build/shaders/hzb.cs.spv
          "$SLANG" shader.hlsl -entry CS_DirectRadiance -stage compute $COMMON -o build/shaders/direct_radiance.cs.spv
          "$SLANG" shader.hlsl -entry CS_SurfaceCacheUpdate -stage compute $COMMON -o build/shaders/surface_cache.cs.spv
          "$SLANG" shader.hlsl -entry CS_ScreenTrace -stage compute $COMMON -o build/shaders/screen_trace.cs.spv
          "$SLANG" shader.hlsl -entry CS_ResetTraceQueue -stage compute $COMMON -o build/shaders/trace_reset.cs.spv
          "$SLANG" shader.hlsl -entry CS_CompactTraceMisses -stage compute $COMMON -o build/shaders/trace_compact.cs.spv
          "$SLANG" shader.hlsl -entry CS_BuildTraceDispatchArgs -stage compute $COMMON -o build/shaders/trace_args.cs.spv
          "$SLANG" shader.hlsl -entry CS_SDFTrace -stage compute $COMMON -o build/shaders/sdf_trace.cs.spv
          "$SLANG" shader.hlsl -entry CS_ScreenProbes -stage compute $COMMON -o build/shaders/screen_probes.cs.spv

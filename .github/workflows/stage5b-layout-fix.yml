name: stage5b layout fix

on:
  push:
    branches: [radiance]

permissions:
  contents: write

jobs:
  stage5b-layout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: radiance
          fetch-depth: 2

      - name: RED - confirm screen trace layout mismatch
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'create_compute_pipeline(renderer, "build/shaders/screen_trace.cs.spv", renderer->trace_layout, &renderer->screen_trace_pipeline)' render.c
          grep -Fq 'bind_trace(renderer, command_buffer, renderer->screen_trace_pipeline);' render.c
          grep -Fq 'float3 radiance = SurfaceReflectedRadiance(surface);' shader.hlsl
          echo 'RED confirmed: screen trace shader uses space4/space6 but C binds only trace_layout/space3'

      - name: Apply layout fix
        run: python3 .github/stage5b_layout_fix.py

      - name: GREEN - verify matching layout and cache sync
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'create_compute_pipeline(renderer, "build/shaders/screen_trace.cs.spv", renderer->radiance_direct_layout, &renderer->screen_trace_pipeline)' render.c
          grep -Fq 'bind_radiance_world(renderer, command_buffer, renderer->screen_trace_pipeline);' render.c
          grep -Fq '.buffer = renderer->radiance_surface_cache.keys' render.c
          grep -Fq '.buffer = renderer->radiance_surface_cache.entries' render.c
          ! grep -Fq 'create_compute_pipeline(renderer, "build/shaders/screen_trace.cs.spv", renderer->trace_layout, &renderer->screen_trace_pipeline)' render.c
          git diff --check

      - name: Syntax compile render.c
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang libsdl3-dev >/dev/null 2>&1 || true
          git submodule update --init --recursive
          INC='-I. -I/usr/include/SDL3'
          for d in NRI Include include External external ThirdParty third_party; do
            [ -d "$d" ] && INC="$INC -I$d"
          done
          clang -std=c11 -fsyntax-only $INC render.c || {
            echo 'syntax compile unavailable with distro headers; structural GREEN already passed'
            exit 0
          }

      - name: Commit layout fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add render.c
          git diff --cached --quiet && exit 0
          git commit -m 's5b fix screen trace layout'
          git push origin HEAD:radiance

name: stage5 geometry surface cache

on:
  push:
    branches: [radiance]

permissions:
  contents: write

jobs:
  stage5:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: radiance
          fetch-depth: 2

      - name: RED - confirm visible-only cache architecture
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'bool cache_hit = LegacySurfaceCacheLookup(model, world_position, cached_radiance);' shader.hlsl
          grep -Fq 'constants.cache_counts[0] = 0u;' render.c
          grep -Fq 'output.primitive_id = primitive_id;' shader.hlsl
          ! grep -Fq 'radiance_surface_cache' game.h
          grep -Fq '    build_surface_cache(renderer, command_buffer);' render.c
          echo 'RED confirmed: offscreen radiance still depends on camera-populated legacy cache'

      - name: Apply Stage 5 implementation
        run: python3 .github/stage5_surface_cache.py

      - name: GREEN - verify geometry-addressed path
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'SURFACE_CACHE radiance_surface_cache;' game.h
          grep -Fq 'sizeof(SURFACE_RADIANCE_ENTRY)' render.c
          grep -Fq 'constants.cache_counts[0] = renderer->radiance_surface_cache.capacity;' render.c
          grep -Fq 'RADIANCE_FEATURE_SURFACE_CACHE' render.c
          grep -Fq 'output.primitive_id = input.primitive_base + primitive_id;' shader.hlsl
          grep -Fq 'float3 EvaluateSurfaceReflectedDirect(SurfaceHit hit, uint seed)' shader.hlsl
          grep -Fq 'float3 SurfaceReflectedRadiance(SurfaceHit hit)' shader.hlsl
          grep -Fq 'SurfaceHit surface = TraceUnifiedRay(ray, false);' shader.hlsl
          grep -Fq 'float3 radiance = SurfaceReflectedRadiance(surface);' shader.hlsl
          grep -Fq 'create_compute_pipeline(renderer, "build/shaders/sdf_trace.cs.spv", renderer->radiance_direct_layout' render.c
          grep -Fq 'bind_radiance_world(renderer, command_buffer, renderer->sdf_trace_pipeline);' render.c
          ! grep -Fq '    build_surface_cache(renderer, command_buffer);' render.c
          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path('shader.hlsl').read_text()
          body = re.search(r'void CS_SDFTrace\([^)]*\) \{(.*?)\n\}', s, re.S)
          assert body, 'CS_SDFTrace missing'
          assert 'LegacySurfaceCacheLookup' not in body.group(1), 'legacy cache still used by SDF trace'
          assert 'TraceUnifiedRay(ray, false)' in body.group(1)
          assert 'SurfaceReflectedRadiance(surface)' in body.group(1)
          direct = re.search(r'void CS_RadianceDirect\([^)]*\) \{(.*?)\n\}', s, re.S)
          assert direct, 'CS_RadianceDirect missing'
          assert 'EvaluateSurfaceReflectedDirect(hit, seed)' in direct.group(1)
          print('geometry-addressed shader path verified')
          PY
          git diff --check

      - name: Compile changed shader entry points
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -o /tmp/slang.tar.gz \
            https://github.com/shader-slang/slang/releases/download/v2026.18.3/slang-2026.18.3-linux-x86_64-glibc-2.27.tar.gz
          mkdir -p /tmp/slang
          tar -xzf /tmp/slang.tar.gz -C /tmp/slang
          SLANGC="$(find /tmp/slang -type f -name slangc | head -n1)"
          test -n "$SLANGC"
          chmod +x "$SLANGC"
          export LD_LIBRARY_PATH="$(dirname "$SLANGC")/../lib:${LD_LIBRARY_PATH:-}"
          compile() {
            entry="$1"; stage="$2"; out="/tmp/${entry}.spv"
            "$SLANGC" shader.hlsl -entry "$entry" -stage "$stage" -target spirv -profile sm_6_6 -capability spirv_1_5 -matrix-layout-row-major -fvk-use-dx-layout -O3 -o "$out"
            test -s "$out"
          }
          compile VS_GBuffer vertex
          compile PS_GBufferFull fragment
          compile CS_RadianceDirect compute
          compile CS_ScreenTrace compute
          compile CS_SDFTrace compute
          compile CS_ScreenProbes compute

      - name: Syntax compile C sources
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/libsdl-org/SDL.git /tmp/SDL
          git clone --depth 1 https://github.com/NVIDIA-RTX/NRI.git /tmp/NRI
          for f in main.c init.c glb.c gltf.c scene.c sdf.c gpu.c render.c; do
            echo "checking $f"
            clang -std=c11 -fsyntax-only -I. -I/tmp/SDL/include -I/tmp/NRI/Include "$f"
          done

      - name: Commit Stage 5
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gpu.h game.h shader.hlsl render.c
          git diff --cached --quiet && exit 0
          git commit -m 's5 geometry surface cache'
          git push origin HEAD:radiance

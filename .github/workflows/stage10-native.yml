name: stage10 native implementation

on:
  push:
    branches: [radiance]

permissions:
  contents: write

jobs:
  stage10:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: radiance
          fetch-depth: 30

      - name: Prepare verification environment
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/libsdl-org/SDL.git /tmp/SDL >/dev/null 2>&1
          git clone --depth 1 https://github.com/NVIDIA-RTX/NRI.git /tmp/NRI >/dev/null 2>&1
          echo 'FLAGS=-I. -I/tmp/SDL/include -I/tmp/NRI/Include -I/tmp/NRI/Include/Extensions' >> "$GITHUB_ENV"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 -m py_compile .github/stage10_apply.py .github/stage10_arch_test.py

      - name: Task 1 RED - interfaces absent
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/stage10_apply.py test1
          if clang -std=c11 -fsyntax-only $FLAGS tests/stage10_world_cache.c >/tmp/task1-red.log 2>&1; then
            echo 'Task 1 unexpectedly green'
            exit 1
          fi
          echo 'Task 1 RED confirmed'
          tail -n 12 /tmp/task1-red.log || true

      - name: Task 1 GREEN - world cache interfaces
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/stage10_apply.py 1
          clang -std=c11 -fsyntax-only $FLAGS tests/stage10_world_cache.c
          clang -std=c11 -fsyntax-only $FLAGS game.h
          git diff --check
          git add game.h tests/stage10_world_cache.c
          git commit -m 's10 world cache interfaces'
          git push origin HEAD:radiance

      - name: Task 2 RED - world probe builder absent
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/stage10_apply.py test2
          if clang -std=c11 $FLAGS tests/stage10_world_cache.c sdf.c -lm -o /tmp/stage10-red >/tmp/task2-red.log 2>&1; then
            echo 'Task 2 unexpectedly green'
            exit 1
          fi
          echo 'Task 2 RED confirmed'
          tail -n 12 /tmp/task2-red.log || true

      - name: Task 2 GREEN - deterministic static world probes
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/stage10_apply.py 2
          clang -std=c11 $FLAGS tests/stage10_world_cache.c sdf.c -lm -o /tmp/stage10_world_cache_test
          /tmp/stage10_world_cache_test
          clang -std=c11 -fsanitize=address,undefined -fno-omit-frame-pointer $FLAGS tests/stage10_world_cache.c sdf.c -lm -o /tmp/stage10_world_cache_asan
          /tmp/stage10_world_cache_asan
          clang -std=c11 -fsyntax-only $FLAGS sdf.c
          git diff --check
          git add sdf.c tests/stage10_world_cache.c
          git commit -m 's10 place world probes'
          git push origin HEAD:radiance

      - name: Task 3 RED - persistent GPU world cache absent
        run: python3 .github/stage10_arch_test.py --red-task 3

      - name: Task 3 GREEN - allocate persistent world cache
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/stage10_apply.py 3
          python3 .github/stage10_arch_test.py --task 3
          clang -std=c11 $FLAGS tests/stage10_world_cache.c sdf.c -lm -o /tmp/stage10_world_cache_test
          /tmp/stage10_world_cache_test
          for f in init.c glb.c gltf.c scene.c sdf.c gpu.c render.c main.c; do
            echo "syntax $f"
            clang -std=c11 -fsyntax-only $FLAGS "$f"
          done
          git diff --check
          git add render.c
          git commit -m 's10 allocate world cache'
          git push origin HEAD:radiance

      - name: Install Slang
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/slang.tar.gz https://github.com/shader-slang/slang/releases/download/v2026.18.3/slang-2026.18.3-linux-x86_64-glibc-2.27.tar.gz
          mkdir -p /tmp/slang
          tar -xzf /tmp/slang.tar.gz -C /tmp/slang
          SLANGC="$(find /tmp/slang -type f -name slangc | head -n1)"
          test -n "$SLANGC"
          chmod +x "$SLANGC"
          echo "SLANGC=$SLANGC" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$(dirname "$SLANGC")/../lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Task 4 RED - stable multibounce shader absent
        run: python3 .github/stage10_arch_test.py --red-task 4

      - name: Task 4 GREEN - propagate stable world radiance
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/stage10_apply.py 4
          python3 .github/stage10_arch_test.py --task 4
          compile() {
            entry="$1"; stage="$2"; shift 2
            "$SLANGC" shader.hlsl -entry "$entry" -stage "$stage" -target spirv -profile sm_6_6 -capability spirv_1_5 -matrix-layout-row-major -fvk-use-dx-layout -O3 "$@" -o "/tmp/${entry}.spv"
            test -s "/tmp/${entry}.spv"
          }
          compile CS_ResetWavefront compute
          compile CS_WavefrontScreenTrace compute
          compile CS_WavefrontDynamicTrace compute
          compile CS_WavefrontGlobalTrace compute
          compile CS_WavefrontLocalTrace compute
          compile CS_ShadeRayHits compute
          compile CS_EmissiveGather compute
          compile CS_UpdateWorldRadianceCache compute
          compile CS_InvalidateRadiance compute
          compile PS_Present fragment -DFINAL_GI
          git diff --check
          git add shader.hlsl
          git commit -m 's10 propagate world radiance'
          git push origin HEAD:radiance

      - name: Task 5 RED - scheduling and dispatch absent
        run: python3 .github/stage10_arch_test.py --red-task 5

      - name: Task 5 GREEN - schedule world cache
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/stage10_apply.py 5
          python3 .github/stage10_arch_test.py
          for f in init.c glb.c gltf.c scene.c sdf.c gpu.c render.c main.c; do
            echo "syntax $f"
            clang -std=c11 -fsyntax-only $FLAGS "$f"
          done
          compile() {
            entry="$1"; stage="$2"
            "$SLANGC" shader.hlsl -entry "$entry" -stage "$stage" -target spirv -profile sm_6_6 -capability spirv_1_5 -matrix-layout-row-major -fvk-use-dx-layout -O3 -o "/tmp/${entry}.spv"
            test -s "/tmp/${entry}.spv"
          }
          compile CS_ResetWavefront compute
          compile CS_UpdateWorldRadianceCache compute
          compile CS_ShadeRayHits compute
          compile CS_InvalidateRadiance compute
          git diff --check
          git add render.c shader.hlsl
          git commit -m 's10 schedule world cache'
          git push origin HEAD:radiance
          echo "STAGE10_PRODUCTION_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Task 6 full CPU and architecture verification
        shell: bash
        run: |
          set -euo pipefail
          clang -std=c11 $FLAGS tests/stage10_world_cache.c sdf.c -lm -o /tmp/stage10_world_cache_test
          /tmp/stage10_world_cache_test
          clang -std=c11 -fsanitize=address,undefined -fno-omit-frame-pointer $FLAGS tests/stage10_world_cache.c sdf.c -lm -o /tmp/stage10_world_cache_asan
          /tmp/stage10_world_cache_asan
          python3 .github/stage10_arch_test.py
          for f in init.c glb.c gltf.c scene.c sdf.c gpu.c render.c main.c; do
            clang -std=c11 -fsyntax-only $FLAGS "$f"
          done
          git diff --check

      - name: Task 6 compile every normal shader job
        shell: bash
        run: |
          set -euo pipefail
          compile() {
            entry="$1"; stage="$2"; shift 2
            "$SLANGC" shader.hlsl -entry "$entry" -stage "$stage" -target spirv -profile sm_6_6 -capability spirv_1_5 -matrix-layout-row-major -fvk-use-dx-layout -O3 "$@" -o "/tmp/all-${entry}.spv"
            test -s "/tmp/all-${entry}.spv"
          }
          compile VS_GBuffer vertex
          compile PS_GBuffer fragment
          compile PS_GBufferFull fragment
          compile VS_Present vertex
          compile PS_Present fragment -DFINAL_GI
          compile PS_PresentRuntime fragment
          compile CS_HZB compute
          compile CS_RadianceDirect compute
          compile CS_ResetWavefront compute
          compile CS_ClassifyRayBudgets compute
          compile CS_GenerateProbeRays compute
          compile CS_WavefrontScreenTrace compute
          compile CS_WavefrontDynamicTrace compute
          compile CS_WavefrontLocalTrace compute
          compile CS_WavefrontGlobalTrace compute
          compile CS_ShadeRayHits compute
          compile CS_EmissiveGather compute
          compile CS_ResolveDirectionalProbes compute
          compile CS_ReprojectScreenProbes compute
          compile CS_SpatialReuseScreenProbes compute
          compile CS_CommitScreenProbeHistory compute
          compile CS_UpdateWorldRadianceCache compute
          compile CS_InvalidateRadiance compute
          compile CS_ReflectionTrace compute
          test "$(grep -c 'CS_UpdateWorldRadianceCache' build.c)" -eq 1
          echo 'Stage 10 full verification PASS'

      - name: Cleanup execution-only Stage 10 files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/stage10_apply.py .github/stage10_arch_test.py .github/workflows/stage10-native.yml
          git add -A .github
          git commit -m 'remove stage10 verification helpers'
          git push origin HEAD:radiance
          changed="$(git diff --name-only "$STAGE10_PRODUCTION_COMMIT" HEAD)"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | grep -vc '^$')" -eq 3
          printf '%s\n' "$changed" | grep -Fxq '.github/stage10_apply.py'
          printf '%s\n' "$changed" | grep -Fxq '.github/stage10_arch_test.py'
          printf '%s\n' "$changed" | grep -Fxq '.github/workflows/stage10-native.yml'
          test -f tests/stage10_world_cache.c

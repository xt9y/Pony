name: stage6 wavefront fixed

on:
  push:
    branches: [radiance]

permissions:
  contents: write

jobs:
  stage6:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: radiance
          fetch-depth: 2

      - name: RED
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'TRACE_QUEUE miss_queue;' game.h
          grep -Fq 'build_screen_trace(renderer, command_buffer);' render.c

      - name: Apply chapter 6
        run: python3 .github/stage6_wavefront_fix.py

      - name: Verify architecture
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'RADIANCE_WAVEFRONT wavefront;' game.h
          grep -Fq 'build_wavefront_screen_probes(renderer, command_buffer);' render.c
          grep -Fq 'constants.feature_flags[2] = renderer->wavefront.ray_capacity;' render.c
          grep -Fq 'CmdClearStorage(command_buffer, &zero_current);' render.c
          grep -Fq '.value = {.f = {.x = 0.0f' render.c
          ! grep -Fq 'TRACE_QUEUE miss_queue;' game.h
          ! grep -Fq 'build_screen_trace(renderer, command_buffer);' render.c
          ! grep -Fq 'build_miss_queue(renderer, command_buffer);' render.c
          ! grep -Fq 'build_sdf_trace(renderer, command_buffer);' render.c
          ! grep -Fq 'build_screen_probes(renderer, command_buffer);' render.c
          ! grep -Fq '{"CS_ScreenTrace", "compute", "screen_trace.cs.spv", NULL}' build.c
          git diff --check

      - name: Compile shader entries
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/slang.tar.gz https://github.com/shader-slang/slang/releases/download/v2026.18.3/slang-2026.18.3-linux-x86_64-glibc-2.27.tar.gz
          mkdir -p /tmp/slang
          tar -xzf /tmp/slang.tar.gz -C /tmp/slang
          SLANGC="$(find /tmp/slang -type f -name slangc | head -n1)"
          chmod +x "$SLANGC"
          export LD_LIBRARY_PATH="$(dirname "$SLANGC")/../lib:${LD_LIBRARY_PATH:-}"
          for entry in CS_RadianceDirect CS_ResetWavefront CS_ClassifyRayBudgets CS_GenerateProbeRays CS_WavefrontScreenTrace CS_WavefrontLocalTrace CS_ShadeRayHits CS_ResolveDirectionalProbes CS_EmissiveGather CS_ReprojectScreenProbes CS_SpatialReuseScreenProbes; do
            "$SLANGC" shader.hlsl -entry "$entry" -stage compute -target spirv -profile sm_6_6 -capability spirv_1_5 -matrix-layout-row-major -fvk-use-dx-layout -O3 -o "/tmp/$entry.spv"
          done
          "$SLANGC" shader.hlsl -entry PS_Present -stage fragment -target spirv -profile sm_6_6 -capability spirv_1_5 -matrix-layout-row-major -fvk-use-dx-layout -O3 -o /tmp/present.spv

      - name: Syntax compile C
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/libsdl-org/SDL.git /tmp/SDL >/dev/null 2>&1
          git clone --depth 1 https://github.com/NVIDIA-RTX/NRI.git /tmp/NRI >/dev/null 2>&1
          FLAGS='-I. -I/tmp/SDL/include -I/tmp/NRI/Include -I/tmp/NRI/Include/Extensions'
          for f in init.c glb.c gltf.c scene.c sdf.c gpu.c render.c main.c; do
            clang -std=c11 -fsyntax-only $FLAGS "$f"
          done

      - name: Commit chapter 6
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game.h render.c shader.hlsl build.c
          git diff --cached --quiet && exit 1
          git commit -m 's6 wavefront screen probes'
          git push origin HEAD:radiance

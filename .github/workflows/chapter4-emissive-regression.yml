name: chapter 4 emissive regression

on:
  push:
    branches: [radiance]

permissions:
  contents: write

jobs:
  regression:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: radiance
          fetch-depth: 2

      - name: RED - visible emitter still leaks into probe radiance
        shell: bash
        run: |
          set -euo pipefail
          if python3 .github/chapter4_emissive_regression_test.py; then
            echo 'Regression test unexpectedly passed before the fix'
            exit 1
          fi
          echo 'RED confirmed: legacy visible-emitter path is still present'

      - name: Apply emissive visibility fix
        run: python3 .github/chapter4_emissive_apply.py

      - name: GREEN - visible emitter no longer leaks into probe radiance
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/chapter4_emissive_regression_test.py
          git diff --check
          git diff --exit-code -- game.h render.c sdf.c build.c

      - name: Commit emissive visibility fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shader.hlsl
          git diff --cached --quiet && exit 0
          git commit -m 's4 emissive fix'
          git push origin HEAD:radiance

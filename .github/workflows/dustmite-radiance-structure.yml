name: dustmite radiance structure

on:
  push:
    branches:
      - dustmite-radiance-structure
  workflow_dispatch:

jobs:
  structure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: verify structural contract
        run: python3 tests/structure_contract.py

  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: install C headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl3-dev libsdl3-image-dev libvulkan-dev
      - name: fetch locked NRI headers
        run: |
          git clone --filter=blob:none https://github.com/NVIDIA-RTX/NRI.git /tmp/NRI
          git -C /tmp/NRI checkout d0c578e613d6efa32893e597b0c24b2f34b9064a
      - name: syntax-check C translation units
        run: |
          CFLAGS="$(pkg-config --cflags sdl3 SDL3_image) -I/tmp/NRI/Include -I."
          for file in main.c init.c glb.c gltf.c bvh.c lmap.c gpu.c render.c bake.c cache.c beam.c; do
            echo "checking $file"
            cc -std=c11 -Wall -Wextra -Wpedantic -fsyntax-only $CFLAGS "$file"
          done

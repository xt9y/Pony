name: dustmite radiance structure

on:
  push:
    branches:
      - dustmite-radiance-structure
      - dustmite-dynamic-lighting
  workflow_dispatch:


jobs:
  structure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: verify structural contract
        run: python3 tests/structure_contract.py
      - name: verify Dustmite behavior contract
        run: python3 tests/behavior_contract.py
      - name: verify clean migration state
        run: |
          test ! -e tools/apply_gpu_split.py
          test ! -e tools/fix_gpu_context_split.py
          test ! -e tools/split_gpu_implementation.py
          test ! -e tools/split_render_gpu.py
          test -z "$(find .github -maxdepth 1 -name 'render-split-trigger*' -print -quit)"
          git diff --check
          git diff --exit-code 0ae0e70364210ec302c8b076ea5513d0dd716612 -- felix-format

  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: install platform headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev
      - name: fetch dependency headers
        run: |
          git clone --depth=1 https://github.com/libsdl-org/SDL.git /tmp/SDL
          git clone --depth=1 https://github.com/libsdl-org/SDL_image.git /tmp/SDL_image
          git clone https://github.com/NVIDIA-RTX/NRI.git /tmp/NRI
          git -C /tmp/NRI checkout d0c578e613d6efa32893e597b0c24b2f34b9064a
      - name: syntax-check C translation units
        run: |
          CFLAGS="-I/tmp/SDL/include -I/tmp/SDL_image/include -I/tmp/NRI/Include -I."
          for file in main.c init.c glb.c gltf.c bvh.c lmap.c gpu.c render.c bake.c cache.c beam.c; do
            echo "checking $file"
            cc -std=c11 -Wall -Wextra -Wpedantic -Werror=implicit-function-declaration -fsyntax-only $CFLAGS "$file"
          done

  shaders:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: install dxc
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc >/dev/null
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-noble.list https://packages.lunarg.com/vulkan/lunarg-vulkan-noble.list
          sudo apt-get update
          sudo apt-get install -y dxc spirv-tools
      - name: compile frozen shader matrix
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import subprocess
          import tempfile

          build = pathlib.Path("build.c").read_text(encoding="utf-8")
          jobs = re.findall(
              r'\{"([^"]+\.hlsl)",\s*"([^"]+)",\s*"([^"]+)",\s*(NULL|"[^"]+"),\s*"([^"]+)",\s*([01])\}',
              build,
          )
          if len(jobs) != 28:
              raise SystemExit(f"expected 28 shader jobs, found {len(jobs)}")

          profiles = {
              "vertex": "vs_6_6",
              "fragment": "ps_6_6",
              "compute": "cs_6_6",
          }

          with tempfile.TemporaryDirectory() as temporary:
              root = pathlib.Path(temporary)
              for path, entry, define, fallback, stage, wave in jobs:
                  output = root / f"{define}.spv"
                  command = [
                      "dxc",
                      "-spirv",
                      "-fspv-target-env=vulkan1.2",
                      "-T", profiles[stage],
                      "-E", entry,
                      "-I", "shaders",
                      f"-D{define}",
                      path,
                      "-Fo", str(output),
                  ]
                  print(" ".join(command))
                  subprocess.run(command, check=True)
                  subprocess.run(["spirv-val", "--target-env", "vulkan1.2", str(output)], check=True)

          print("all 27 frozen Dustmite shader jobs compile and validate")
          PY

name: stage4 direct lighting fix

on:
  push:
    branches: [radiance]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: radiance
          fetch-depth: 2

      - name: RED - confirm emitter is still wired through screen probes
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'create_compute_pipeline(renderer, "build/shaders/direct_radiance.cs.spv", renderer->trace_layout, &renderer->direct_radiance_pipeline)' render.c
          grep -Fq '    build_emissive_gather(renderer, command_buffer);' render.c
          ! grep -Fq 'DirectRadianceOutput[pixel] = float4(direct, 1.0f);' shader.hlsl
          echo 'RED confirmed: permanent direct shader is compiled but not active; emitter NEE is added in screen-probe space'

      - name: Apply direct-lighting architecture fix
        run: python3 .github/stage4_direct_fix.py

      - name: GREEN - verify direct-light architecture
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'DirectRadianceOutput[pixel] = float4(direct, 1.0f);' shader.hlsl
          grep -Fq 'DirectRadianceOutput[pixel] = float4(FutureSkyRadiance(direction), 1.0f);' shader.hlsl
          grep -Fq 'create_compute_pipeline(renderer, "build/shaders/radiance_direct.cs.spv", renderer->radiance_direct_layout, &renderer->direct_radiance_pipeline)' render.c
          grep -Fq 'NriPipelineLayout *radiance_direct_layout;' game.h
          grep -Fq 'static void bind_radiance_direct' render.c
          grep -Fq 'if (renderer->radiance_direct_scene_set && !update_radiance_scene_descriptor_set' render.c
          grep -Fq 'update_radiance_direct_cache_descriptors(renderer)' render.c
          ! grep -Fq '    build_emissive_gather(renderer, command_buffer);' render.c
          grep -Fq '{"CS_RadianceDirect", "compute", "radiance_direct.cs.spv", NULL}' build.c
          git diff --check

      - name: Syntax compile C sources
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/libsdl-org/SDL.git /tmp/SDL
          git clone --depth 1 https://github.com/NVIDIA-RTX/NRI.git /tmp/NRI
          for f in main.c init.c glb.c gltf.c scene.c sdf.c gpu.c render.c; do
            echo "checking $f"
            clang -std=c11 -fsyntax-only -I. -I/tmp/SDL/include -I/tmp/NRI/Include "$f"
          done

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shader.hlsl game.h render.c
          git diff --cached --quiet && exit 0
          git commit -m 's4 direct emissive path'
          git push origin HEAD:radiance

name: chapter 2 implement

on:
  push:
    branches: [radiance]

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: radiance
          fetch-depth: 2

      - name: Apply Chapter 2
        run: python3 .github/chapter2_apply.py

      - name: Verify Chapter 2 source structure
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'GPU_SCENE_TRIANGLE \*cpu_triangles;' game.h
          grep -q 'NriBuffer \*radiance_constants_buffer;' game.h
          grep -q 'NriDescriptorSet \*radiance_scene_set;' game.h
          grep -q 'static bool create_radiance_scene_gpu_resources' render.c
          grep -q 'static bool create_radiance_constant_buffers' render.c
          grep -q 'static bool update_radiance_constants' render.c
          grep -q 'static bool update_radiance_scene_descriptors' render.c
          grep -q 'Radiance GPU scene:' render.c
          git diff --exit-code -- shader.hlsl

      - name: Fetch header dependencies
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/libsdl-org/SDL.git /tmp/SDL
          git clone --depth 1 https://github.com/NVIDIA-RTX/NRI.git /tmp/NRI

      - name: Compile C translation units
        shell: bash
        run: |
          set -euxo pipefail
          COMMON='-std=c11 -I. -I/tmp/SDL/include -I/tmp/NRI/Include -Werror=implicit-function-declaration'
          printf '#include "game.h"\nint main(void) { return 0; }\n' >/tmp/abi_check.c
          cc $COMMON -fsyntax-only /tmp/abi_check.c
          for file in main.c init.c glb.c gltf.c scene.c sdf.c gpu.c render.c; do
            cc $COMMON -fsyntax-only "$file"
          done

      - name: Commit Chapter 2
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game.h render.c
          git diff --cached --quiet && exit 0
          git commit -m 's2'
          git push origin HEAD:radiance

name: peripheral-vision-split
on:
  push:
    branches: [peripheral-vision-split-work]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm RED before implementation
        run: |
          if python3 .github/peripheral_vision_split_test.py; then
            echo "expected regression test to fail before implementation"
            exit 1
          fi
          echo "RED confirmed"

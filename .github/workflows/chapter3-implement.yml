name: chapter 3 implement

on:
  push:
    branches: [radiance]

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: radiance
          fetch-depth: 2

      - name: Apply Chapter 3
        run: python3 .github/chapter3_apply.py

      - name: Verify Chapter 3 source structure
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- shader.hlsl
          grep -q 'RENDER_TEXTURE material_id;' game.h
          grep -q 'RENDER_TEXTURE primitive_id;' game.h
          grep -q 'gbuffer_full.ps.spv' render.c
          grep -q '&renderer->material_id' render.c
          grep -q '&renderer->primitive_id' render.c
          grep -q 'renderer->material_id.srv, renderer->primitive_id.srv' render.c
          grep -q 'rangeIndex = 4' render.c
          grep -q 'colorNum = 7' render.c
          grep -q 'PS_GBufferFull.*gbuffer_full.ps.spv' build.c || grep -q '"PS_GBufferFull", "fragment", "gbuffer_full.ps.spv"' build.c

      - name: Fetch header dependencies
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/libsdl-org/SDL.git /tmp/SDL
          git clone --depth 1 https://github.com/NVIDIA-RTX/NRI.git /tmp/NRI

      - name: Compile C translation units
        shell: bash
        run: |
          set -euxo pipefail
          COMMON='-std=c11 -I. -I/tmp/SDL/include -I/tmp/NRI/Include -Werror=implicit-function-declaration'
          printf '#include "game.h"\nint main(void) { return 0; }\n' >/tmp/abi_check.c
          cc $COMMON -fsyntax-only /tmp/abi_check.c
          for file in main.c init.c glb.c gltf.c scene.c sdf.c gpu.c render.c; do
            cc $COMMON -fsyntax-only "$file"
          done

      - name: Commit Chapter 3
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game.h render.c
          git diff --cached --quiet && exit 0
          git commit -m 's3'
          git push origin HEAD:radiance

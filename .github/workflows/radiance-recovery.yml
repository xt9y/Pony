name: radiance recovery

on:
  push:
    branches: [radiance]

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: radiance
          fetch-depth: 2

      - name: RED - confirm catastrophic per-pixel world tracing
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '#define SCREEN_PROBE_RAY_COUNT 16u' shader.hlsl
          grep -Fq '#define DIRECT_EMISSIVE_SAMPLE_COUNT 4u' shader.hlsl
          grep -Fq 'if (TraceUnifiedOcclusion(shadow)) continue;' shader.hlsl
          grep -Fq 'float3 reflected = EvaluateSurfaceReflectedDirect(hit, seed);' shader.hlsl
          grep -Fq 'SurfaceCacheStore(hit, reflected, 0.0f, 1.0f);' shader.hlsl
          grep -Fq 'float3 radiance = SurfaceReflectedRadiance(surface);' shader.hlsl
          grep -Fq 'create_compute_pipeline(renderer, "build/shaders/radiance_direct.cs.spv", renderer->radiance_direct_layout' render.c
          grep -Fq 'create_compute_pipeline(renderer, "build/shaders/screen_trace.cs.spv", renderer->radiance_direct_layout' render.c
          ! grep -Fq 'build_emissive_gather(renderer, command_buffer);' <(sed -n '/bool renderer_frame/,/return true;/p' render.c)
          echo 'RED confirmed: per-pixel world tracing and cache writes are active'

      - name: Apply recovery
        run: python3 .github/radiance_recovery.py

      - name: GREEN - verify sparse radiance workload
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '#define SCREEN_PROBE_RAY_COUNT 8u' shader.hlsl
          ! grep -Fq '#define DIRECT_EMISSIVE_SAMPLE_COUNT' shader.hlsl
          grep -Fq '#define SCREEN_PROBE_DIRECTION_COUNT 8u' game.h
          grep -Fq 'if (ray_index >= SCREEN_PROBE_RAY_COUNT)' shader.hlsl
          grep -Fq 'TraceHit hit = TraceProbeScreenHit(ray);' shader.hlsl
          grep -Fq 'float3 radiance = ReflectedDirectAtPixel(hit.hit_pixel);' shader.hlsl
          grep -Fq 'radiance += EvaluateAnalyticLightDiffuse(Lights[i], albedo, position, normal);' shader.hlsl
          grep -Fq 'build_emissive_gather(renderer, command_buffer);' render.c
          grep -Fq 'create_compute_pipeline(renderer, "build/shaders/radiance_direct.cs.spv", renderer->trace_layout' render.c
          grep -Fq 'create_compute_pipeline(renderer, "build/shaders/screen_trace.cs.spv", renderer->trace_layout' render.c
          ! grep -Fq '{"CS_DirectRadiance", "compute", "direct_radiance.cs.spv", NULL}' build.c

          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path('shader.hlsl').read_text()
          r = Path('render.c').read_text()

          direct = re.search(r'void CS_RadianceDirect\([^)]*\) \{(.*?)\n\}', s, re.S)
          assert direct, 'CS_RadianceDirect missing'
          body = direct.group(1)
          assert 'TraceUnifiedOcclusion' not in body
          assert 'SurfaceReflectedRadiance' not in body
          assert 'EvaluateSurfaceReflectedDirect' not in body
          assert 'SurfaceCacheStore' not in body
          assert 'EvaluateEmissiveSample' not in body
          assert 'SceneLights' not in body
          assert 'SceneMaterials' not in body
          assert 'SceneTriangles' not in body

          surface = re.search(r'float3 EvaluateSurfaceReflectedDirect\(SurfaceHit hit\) \{(.*?)\n\}', s, re.S)
          assert surface, 'cheap offscreen direct missing'
          body = surface.group(1)
          assert 'TraceUnifiedOcclusion' not in body
          assert 'EvaluateEmissiveSample' not in body
          assert 'EvaluateAnalyticLightDiffuse' in body

          screen = re.search(r'void CS_ScreenTrace\([^)]*\) \{(.*?)\n\}', s, re.S)
          assert screen, 'CS_ScreenTrace missing'
          body = screen.group(1)
          assert 'ReflectedDirectAtPixel' in body
          assert 'SurfaceReflectedRadiance' not in body
          assert 'TraceScreenSurface' not in body

          frame = re.search(r'bool renderer_frame\([^)]*\) \{(.*)\n\}', r, re.S)
          assert frame
          body = frame.group(1)
          assert body.index('build_screen_probes(renderer, command_buffer);') < body.index('build_emissive_gather(renderer, command_buffer);') < body.index('record_present_pass(renderer, command_buffer, swapchain_index);')

          direct_dispatch = re.search(r'static void build_direct_radiance\([^)]*\) \{(.*?)\n\}', r, re.S)
          assert direct_dispatch
          assert 'bind_trace(renderer, command_buffer, renderer->direct_radiance_pipeline);' in direct_dispatch.group(1)
          assert 'radiance_surface_cache' not in direct_dispatch.group(1)

          screen_dispatch = re.search(r'static void build_screen_trace\([^)]*\) \{(.*?)\n\}', r, re.S)
          assert screen_dispatch
          assert 'bind_trace(renderer, command_buffer, renderer->screen_trace_pipeline);' in screen_dispatch.group(1)
          assert 'radiance_surface_cache' not in screen_dispatch.group(1)

          print('sparse radiance architecture verified')
          PY
          git diff --check

      - name: Compile active shader entry points
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -o /tmp/slang.tar.gz \
            https://github.com/shader-slang/slang/releases/download/v2026.18.3/slang-2026.18.3-linux-x86_64-glibc-2.27.tar.gz
          mkdir -p /tmp/slang
          tar -xzf /tmp/slang.tar.gz -C /tmp/slang
          SLANGC="$(find /tmp/slang -type f -name slangc | head -n1)"
          test -n "$SLANGC"
          chmod +x "$SLANGC"
          export LD_LIBRARY_PATH="$(dirname "$SLANGC")/../lib:${LD_LIBRARY_PATH:-}"
          compile() {
            entry="$1"; stage="$2"; out="/tmp/${entry}.spv"
            "$SLANGC" shader.hlsl -entry "$entry" -stage "$stage" -target spirv -profile sm_6_6 -capability spirv_1_5 -matrix-layout-row-major -fvk-use-dx-layout -O3 -o "$out"
            test -s "$out"
          }
          compile CS_RadianceDirect compute
          compile CS_ScreenTrace compute
          compile CS_ResetTraceQueue compute
          compile CS_CompactTraceMisses compute
          compile CS_BuildTraceDispatchArgs compute
          compile CS_SDFTrace compute
          compile CS_ScreenProbes compute
          compile CS_EmissiveGather compute
          compile PS_Present fragment

      - name: Syntax compile renderer sources
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/libsdl-org/SDL.git /tmp/SDL >/dev/null 2>&1
          git clone --depth 1 https://github.com/NVIDIA-RTX/NRI.git /tmp/NRI >/dev/null 2>&1
          FLAGS='-I. -I/tmp/SDL/include -I/tmp/NRI/Include -I/tmp/NRI/Include/Extensions'
          for f in init.c glb.c gltf.c scene.c sdf.c gpu.c render.c main.c; do
            echo "syntax $f"
            clang -std=c11 -fsyntax-only $FLAGS "$f"
          done

      - name: Commit recovery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shader.hlsl game.h render.c build.c
          git diff --cached --quiet && exit 0
          git commit -m 'recover sparse radiance path'
          git push origin HEAD:radiance
